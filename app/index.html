<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ClauseStream</title>
<meta name="description" content="One record every party on a construction project checks changes against: sub, GC/CM, architect and owner, each seeing what its contracts allow.">
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="/" aria-label="ClauseStream home"><span class="mark">§</span><span class="hide-sm">ClauseStream</span></a>
    <button class="chip-btn" id="contractBtn" title="The contract these checks use"><span class="dot"></span><span class="hide-md hide-lg">Checking against:</span> <b>Sample GC/CM contract</b></button>
    <div class="seg" id="roles" role="radiogroup" aria-label="I am the">
      <span class="seg-lbl hide-md">I'm the</span>
      <button role="radio" data-role="sub">Sub</button><button role="radio" data-role="gc">GC/CM</button><button role="radio" data-role="architect">Architect</button><button role="radio" data-role="owner">Owner's rep</button>
    </div>
  </div>
</header>
<div id="modeband" class="modeband" role="status" hidden></div>
<nav class="sheets" aria-label="Sheets in this project">
  <div class="sheets-in">
    <a href="#home" data-nav="home"><b>Home</b><span>Waiting on you</span></a>
    <a href="#changes" data-nav="changes"><b>01</b><span>Changes</span></a>
    <a href="#record" data-nav="record"><b>02</b><span>Record</span></a>
    <a href="#contracts" data-nav="contracts"><b>03</b><span>Contracts</span></a>
    <a href="#schedule" data-nav="schedule"><b>04</b><span>Schedule</span></a>
    <a href="#activity" data-nav="activity"><b>05</b><span>Activity</span></a>
    <a href="#project" data-nav="project"><b>06</b><span>Project</span></a>
    <a href="#upload" data-nav="check" class="quick"><b>QC</b><span>Quick check</span></a>
  </div>
</nav>

<main id="app"></main>

<div class="modal" id="contractModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="cmTitle">
    <div class="modal-h"><div><span class="eyebrow">Checking against</span><h2 id="cmTitle">Sample GC/CM contract</h2></div><button class="x" data-close aria-label="Close">✕</button></div>
    <div id="cmBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/assets/checks.js"></script>
<script src="/assets/contract.js"></script>
<script src="/assets/schedule.js"></script>
<script src="/assets/delay.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/views-time.js"></script>
<script src="/assets/rules.js"></script>
<script src="/assets/demo-db.js"></script>
<script src="/assets/vendor/supabase/supabase.js"></script>
<script src="/assets/platform.js"></script>
<script src="/assets/views-platform.js"></script>
<script src="/assets/guide.js"></script>
</body>
</html>
