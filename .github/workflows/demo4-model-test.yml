# Demo 4 model test: the contract term reader (2 synthetic contracts) and the fragnet drafter (14 synthetic change orders),
# scored against the answer keys with dev and test reported separately.
# No API key, no cost. Start: Actions -> "Demo 4 model test" -> Run workflow (once per model to compare).
name: Demo 4 model test

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model"
        required: true
        default: "llama3.1:8b"
      runs:
        description: "Readings per contract (they must agree to be marked verified)"
        required: true
        default: "3"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Install Ollama and pull the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          (OLLAMA_KEEP_ALIVE=3h ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -s localhost:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "${{ inputs.model }}"
      - name: Read and score the contracts
        run: python3 demo4/contract_test.py --model "${{ inputs.model }}" --runs "${{ inputs.runs }}"
      - name: Draft and score the fragnets
        run: python3 demo4/fragnet_test.py --model "${{ inputs.model }}" --runs "${{ inputs.runs }}"
      - name: Commit results
        run: |
          M=$(echo "${{ inputs.model }}" | tr ':/' '__')
          mv demo4/results/contract_test.json "demo4/results/contract_test_${M}.json"
          mv demo4/results/fragnet_runs.json "demo4/results/fragnet_runs_${M}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add "demo4/results/contract_test_${M}.json" "demo4/results/fragnet_runs_${M}.json"
          git commit -m "Demo 4 model test results (${{ inputs.model }})" || echo "nothing to commit"
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
