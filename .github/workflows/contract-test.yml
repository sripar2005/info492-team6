# Tests the contract term reader (demo4/contract_extract.py) with a free local model on the two synthetic contracts.
# No API key, no cost. Start: Actions -> "Contract reader test" -> Run workflow.
name: Contract reader test

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ollama model"
        required: true
        default: "llama3.1:8b"
      runs:
        description: "Readings per contract (they must agree to be marked verified)"
        required: true
        default: "3"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Install Ollama and pull the model
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama 2>/dev/null || true
          (OLLAMA_KEEP_ALIVE=3h ollama serve > /tmp/ollama.log 2>&1 &)
          for i in $(seq 1 30); do curl -s localhost:11434/api/tags >/dev/null && break; sleep 2; done
          ollama pull "${{ inputs.model }}"
      - name: Read and score the contracts
        run: python3 demo4/contract_test.py --model "${{ inputs.model }}" --runs "${{ inputs.runs }}"
      - name: Commit results
        run: |
          M=$(echo "${{ inputs.model }}" | tr ':/' '__')
          cp demo4/results/contract_test.json "demo4/results/contract_test_${M}.json"
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git pull --rebase -q
          git add demo4/results/
          git commit -m "Contract reader test results (${{ inputs.model }})" || echo "nothing to commit"
          git push
