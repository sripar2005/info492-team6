<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Check a change proposal · ClauseStream</title>
<meta name="description" content="Check a priced change proposal against the contract before you send it: markups, the CM fee, labor rates, equipment, deadlines and signatures.">
<meta name="theme-color" content="#0b0c0e">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="logo" href="/clausestream/" aria-label="ClauseStream home"><span class="mark">§</span><span class="hide-sm">ClauseStream</span></a>
    <button class="chip-btn" id="contractBtn" title="The contract these checks use"><span class="dot"></span><span class="hide-md">Checking against:</span> <b>Sample GC/CM contract</b></button>
    <div class="seg" id="roles" role="radiogroup" aria-label="I am the">
      <span class="seg-lbl hide-md">I'm the</span>
      <button role="radio" data-role="sub">Sub</button><button role="radio" data-role="gc">GC/CM</button><button role="radio" data-role="architect">Architect</button><button role="radio" data-role="owner">Owner's rep</button>
    </div>
    <nav class="links">
      <a href="#upload" data-nav="check">Check</a>
      <a href="#proposals" data-nav="proposals">My proposals</a>
      <a href="#schedule" data-nav="schedule">Schedule</a>
      <a href="#delay" data-nav="delay">Delay</a>
      <a href="/demo3/" class="hide-sm">How it works</a>
    </nav>
  </div>
</header>

<main id="app"></main>

<div class="modal" id="contractModal" hidden>
  <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="cmTitle">
    <div class="modal-h"><div><span class="eyebrow">Checking against</span><h2 id="cmTitle">Sample GC/CM contract</h2></div><button class="x" data-close aria-label="Close">✕</button></div>
    <div id="cmBody"></div>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script src="/assets/checks.js"></script>
<script src="/assets/contract.js"></script>
<script src="/assets/schedule.js"></script>
<script src="/assets/delay.js"></script>
<script src="/assets/app.js"></script>
<script src="/assets/views-time.js"></script>
</body>
</html>
